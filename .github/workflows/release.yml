name: release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify release version
        run: .\gradlew.bat verifyReleaseVersion

      - name: Verify and build sample portable EXE
        run: .\gradlew.bat :webview2-compose:check :webview2-sample:createDistributable --no-configuration-cache

      - name: Write signing key
        env:
          OSSRH_GPG_SECRET_FILE_BASE64: ${{ secrets.OSSRH_GPG_SECRET_FILE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'secring.gpg'), [Convert]::FromBase64String($env:OSSRH_GPG_SECRET_FILE_BASE64))

      - name: Publish to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          OSSRH_GPG_SECRET_KEY_ID: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          .\gradlew.bat publishAndReleaseToMavenCentral --no-configuration-cache `
            "-PmavenCentralUsername=$env:OSSRH_USERNAME" `
            "-PmavenCentralPassword=$env:OSSRH_PASSWORD" `
            "-Psigning.keyId=$env:OSSRH_GPG_SECRET_KEY_ID" `
            "-Psigning.password=$env:OSSRH_GPG_SECRET_KEY_PASSWORD" `
            "-Psigning.secretKeyRingFile=$env:GITHUB_WORKSPACE/secring.gpg"

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path 'webview2-sample/build/compose/binaries/main/app/WebView2Sample' -DestinationPath "webview2-sample-$env:RELEASE_TAG-windows-x64-portable.zip"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: '*-windows-x64-portable.zip'
          fail_on_unmatched_files: true
